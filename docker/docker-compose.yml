services:
  db:
    image: postgres:15
    container_name: habitdb
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: habituser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habituser"]
      interval: 10s
      timeout: 5s
      retries: 5